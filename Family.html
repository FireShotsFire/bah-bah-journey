<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>Where is Bah Bah? ❤️</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<main class="app">

  <header>

    <div class="heart">❤️</div>

    <h1>Where is Bah Bah?</h1>

    <p class="subtitle">
      Journey to work
    </p>

  </header>


  <!-- CURRENT LOCATION -->

  <section class="current">

    <div
      id="currentEmoji"
      class="current-emoji"
    >
      🚶‍♂️
    </div>

    <h2 id="currentTitle">
      Loading...
    </h2>


    <div class="progress-container">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>


    <div
      id="progressText"
      class="progress-text"
    >
      0%
    </div>


    <div class="up-next">

      <div class="up-next-label">
        Up next
      </div>

      <div
        id="upNext"
        class="up-next-stage"
      >
        Loading...
      </div>

    </div>

  </section>


  <!-- JOURNEY TIMELINE -->

  <section
    id="journey"
    class="journey"
  >

    <div class="loading">
      Loading journey...
    </div>

  </section>


  <p
    id="status"
    class="updated"
  >
    Connecting...
  </p>


  <p
    id="updated"
    class="updated"
  ></p>

</main>


<script src="config.js"></script>

<script src="Family.js"></script>

</body>

</html>
